name: Build EXE

on:
  push:
    branches: [ "release-exe", "arena/01a0c9e9-cbopka", "main" ]
  workflow_dispatch:

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install server deps
        shell: bash
        run: |
          cd server
          npm install
          
      - name: Install client deps
        run: |
          cd client
          npm install --legacy-peer-deps
          
      - name: Build client (pwsh)
        shell: pwsh
        run: |
          cd client
          Write-Host "Node version:"
          node --version
          Write-Host "NPM version:"
          npm --version
          Write-Host "Files:"
          dir
          Write-Host "Building..."
          npm run build 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Build failed, log:"
            Get-Content build.log
            exit 1
          }
          dir dist
          
      - name: Upload client build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: client-build-log
          path: client/build.log
          
      - name: Build Electron EXE (Variant 2 - True Native Window)
        shell: pwsh
        run: |
          cd electron
          npm install --legacy-peer-deps
          dir
          npx electron-builder --win portable -c electron-builder.yml --publish never 2>&1 | Tee-Object -FilePath ../electron-build.log
          dir ../release/ -ErrorAction SilentlyContinue
          dir dist/ -ErrorAction SilentlyContinue
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Build Python EXE (Variant 2 - True Native App)
        shell: pwsh
        run: |
          pip install pywebview pyinstaller
          pyinstaller --onefile --windowed --name Cbopka-App-Native Cbopka-Native.py 2>&1 | Tee-Object -FilePath ../pyinstaller-native.log
          pyinstaller --onefile --windowed --name Cbopka-App Cbopka.py 2>&1 | Tee-Object -FilePath ../pyinstaller.log
          dir dist/
          
      - name: Upload EXE artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cbopka-EXE-Windows
          path: |
            release/*.exe
            dist/*.exe
            electron/release/*.exe
            client/dist/**/*
            *-build.log
            *.log
            
      - name: Upload to Release
        if: success()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v1.0.0-p2p || gh release create v1.0.0-p2p --title "Cbopka P2P + Native Apps" --notes "Native apps v2 true window"
          for f in release/*.exe dist/*.exe; do
            if [ -f "$f" ]; then
              echo "Uploading $f"
              gh release upload v1.0.0-p2p "$f" --clobber || true
            fi
          done
