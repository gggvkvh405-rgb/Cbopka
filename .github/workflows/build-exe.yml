name: Build EXE

on:
  push:
    branches: [ "release-exe", "arena/01a0c9e9-cbopka", "main" ]
  workflow_dispatch:

jobs:
  build-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build client on Linux
        run: |
          cd client
          echo "Node $(node -v) NPM $(npm -v)"
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps 2>&1 | tail -30
          echo "=== BUILD ==="
          npm run build 2>&1 | tee /tmp/build.log
          echo "=== TAIL ==="
          tail -100 /tmp/build.log
          ls -lh dist/
      - name: Upload log on failure via API
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat /tmp/build.log | tail -200 > /tmp/error.txt
          echo "Error log:"
          cat /tmp/error.txt
          # Try to create gist with error
          CONTENT=$(base64 -w0 /tmp/error.txt)
          # Use gh api to create file in repo via contents API
          gh api repos/${{ github.repository }}/contents/build-error.log --method PUT -f message="build error $(date)" -f content="$CONTENT" -f sha="" 2>&1 | head -20 || true
          # Also try to push to error-logs branch via git
          git config --global user.email "bot@example.com"
          git config --global user.name "bot"
          git checkout -b error-logs-temp || git checkout error-logs-temp
          cp /tmp/build.log ./build-error.log
          git add build-error.log
          git commit -m "error log" || true
          git push origin error-logs-temp --force || true
      - name: Upload client dist
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist

  build-win:
    runs-on: windows-latest
    needs: build-client
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download client dist
        uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: client/dist
      - name: List client dist
        shell: bash
        run: ls -lh client/dist/
      - name: Install server deps
        shell: bash
        run: cd server && npm install
      - name: Build Electron EXE
        shell: bash
        run: |
          cd electron
          npm install --legacy-peer-deps
          npx electron-builder --win portable -c electron-builder.yml --publish never 2>&1 | tail -100 || true
          ls -lh ../release/ || true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build Python EXE
        shell: bash
        run: |
          pip install pywebview pyinstaller
          pyinstaller --onefile --windowed --name Cbopka-App-Native Cbopka-Native.py
          pyinstaller --onefile --windowed --name Cbopka-App Cbopka.py || true
          ls -lh dist/
      - name: Upload EXE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Cbopka-EXE-Windows
          path: |
            release/*.exe
            dist/*.exe
      - name: Upload to Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v1.0.0-p2p || gh release create v1.0.0-p2p --title "Cbopka P2P + Native Apps" --notes "Native apps v2 true window"
          for f in release/*.exe dist/*.exe; do if [ -f "$f" ]; then gh release upload v1.0.0-p2p "$f" --clobber || true; fi; done
