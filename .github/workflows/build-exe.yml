name: Build EXE

on:
  push:
    branches: [ "release-exe", "arena/01a0c9e9-cbopka", "main" ]
  workflow_dispatch:

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check client dist
        shell: bash
        run: ls -lh client/dist/ && ls -lh client/dist/assets/ | head -10

      - name: Install server deps
        shell: bash
        run: cd server && npm install

      - name: Build Electron EXE (Variant 2 - True Native Window)
        shell: bash
        run: |
          cd electron
          npm install --legacy-peer-deps
          npx electron-builder --win portable -c electron-builder.yml --publish never 2>&1 | tail -50 || true
          ls -lh ../release/ || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Python EXE (Variant 2 - True Native App)
        shell: bash
        run: |
          pip install pywebview pyinstaller
          pyinstaller --onefile --windowed --name Cbopka-App-Native Cbopka-Native.py 2>&1 | tail -20 || true
          pyinstaller --onefile --name Cbopka-App Cbopka.py 2>&1 | tail -20 || true
          ls -lh dist/ || true
          ls -lh release/ || true

      - name: Upload EXE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Cbopka-EXE-Windows
          path: |
            release/
            dist/

      - name: Upload to file.io and save link to repo
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Uploading to file.io ==="
          for f in release/*.exe dist/*.exe; do
            if [ -f "$f" ]; then
              echo "Uploading $f..."
              LINK=$(curl -s -F "file=@$f" https://file.io | grep -o '"link":"[^"]*"' | cut -d'"' -f4)
              echo "Link for $f: $LINK"
              echo "$f: $LINK" >> /tmp/links.txt
            fi
          done
          cat /tmp/links.txt || true
          # Save links to file and commit to arena branch
          git config --global user.email "bot@example.com"
          git config --global user.name "bot"
          git checkout arena/01a0c9e9-cbopka || git checkout -b arena/01a0c9e9-cbopka
          mkdir -p release
          echo "# Direct download links for Variant2 Native App (not browser!)" > release/DOWNLOAD-LINKS.md
          echo "" >> release/DOWNLOAD-LINKS.md
          cat /tmp/links.txt >> release/DOWNLOAD-LINKS.md || echo "No links" >> release/DOWNLOAD-LINKS.md
          echo "" >> release/DOWNLOAD-LINKS.md
          echo "Built from commit ${{ github.sha }}" >> release/DOWNLOAD-LINKS.md
          echo "Date $(date)" >> release/DOWNLOAD-LINKS.md
          cat release/DOWNLOAD-LINKS.md
          git add release/DOWNLOAD-LINKS.md
          git commit -m "feat: add direct download links for native v2 exe" || true
          git push origin arena/01a0c9e9-cbopka --force || true

      - name: Upload to Release via action
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0.0-p2p
          files: |
            release/*.exe
            dist/*.exe
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
