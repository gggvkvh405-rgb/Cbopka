name: Build EXE

on:
  push:
    branches: [ "release-exe", "arena/01a0c9e9-cbopka", "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check client dist
        shell: bash
        run: ls -lh client/dist/ && ls -lh client/dist/assets/ | head -10

      - name: Install server deps
        shell: bash
        run: cd server && npm install

      - name: Build Electron EXE (Variant 2 - True Native Window)
        shell: bash
        run: |
          cd electron
          npm install --legacy-peer-deps
          npx electron-builder --win portable -c electron-builder.yml --publish never 2>&1 | tail -50 || true
          ls -lh ../release/ || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Python EXE (Variant 2 - True Native App)
        shell: bash
        run: |
          pip install pywebview pyinstaller
          pyinstaller --onefile --windowed --name Cbopka-App-Native Cbopka-Native.py 2>&1 | tail -20 || true
          pyinstaller --onefile --name Cbopka-App Cbopka.py 2>&1 | tail -20 || true
          ls -lh dist/ || true
          ls -lh release/ || true

      - name: Upload EXE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Cbopka-EXE-Windows
          path: |
            release/
            dist/

      - name: Upload to file.io and save link to release-exe branch
        shell: bash
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Uploading to file.io ===" || true
          for f in release/*.exe dist/*.exe; do
            if [ -f "$f" ]; then
              echo "Uploading $f to file.io..." || true
              curl -s -F "file=@$f" https://file.io 2>&1 | tail -10 || true
            fi
          done
          echo "=== Pushing exe to release-exe branch ===" || true
          git config --global user.email "bot@example.com" || true
          git config --global user.name "bot" || true
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git || true
          mkdir -p /tmp/exe-save || true
          cp release/*.exe /tmp/exe-save/ 2>/dev/null || true
          cp dist/*.exe /tmp/exe-save/ 2>/dev/null || true
          ls -lh /tmp/exe-save/ || true
          git fetch origin release-exe || true
          git checkout release-exe || git checkout -b release-exe || true
          mkdir -p release || true
          cp /tmp/exe-save/*.exe release/ 2>/dev/null || true
          ls -lh release/ | head -20 || true
          git add release/*.exe || true
          git status --short | head -20 || true
          git commit -m "feat: native exe v2 true window $(date)" || echo "no changes"
          git push origin release-exe --force || echo "push failed"

      - name: Upload to Release via action
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0.0-p2p
          files: |
            release/*.exe
            dist/*.exe
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
