name: Build EXE

on:
  push:
    branches: [ "release-exe", "arena/01a0c9e9-cbopka", "main" ]
  workflow_dispatch:

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check client dist
        shell: bash
        run: ls -lh client/dist/ && ls -lh client/dist/assets/ | head -10

      - name: Install server deps
        shell: bash
        run: cd server && npm install

      - name: Build Electron EXE (Variant 2 - True Native Window)
        shell: bash
        run: |
          cd electron
          npm install --legacy-peer-deps
          npx electron-builder --win portable -c electron-builder.yml --publish never 2>&1 | tail -50 || true
          echo "=== RELEASE ==="
          ls -lh ../release/ || true
          ls -lh release/ || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Python EXE (Variant 2 - True Native App)
        shell: bash
        run: |
          pip install pywebview pyinstaller
          pyinstaller --onefile --windowed --name Cbopka-App-Native Cbopka-Native.py 2>&1 | tail -20 || true
          pyinstaller --onefile --name Cbopka-App Cbopka.py 2>&1 | tail -20 || true
          ls -lh dist/ || true
          echo "=== ALL EXE ==="
          ls -lh release/*.exe 2>/dev/null || echo "no release/*.exe"
          ls -lh dist/*.exe 2>/dev/null || echo "no dist/*.exe"
          ls -lh *.exe 2>/dev/null || echo "no *.exe at root"
          find . -maxdepth 3 -name "*.exe" -type f -exec ls -lh {} \; 2>/dev/null | head -20 || true

      - name: Upload EXE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Cbopka-EXE-Windows
          path: |
            release/*.exe
            dist/*.exe
            electron/release/*.exe

      - name: Upload to Release (explicit)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Write-Host "=== Finding exe files ==="
          Get-ChildItem -Recurse -Filter *.exe | ForEach-Object { Write-Host $_.FullName " - " $_.Length }
          Write-Host "=== Creating release if needed ==="
          gh release view v1.0.0-p2p 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create v1.0.0-p2p --title "Cbopka P2P + Native Apps" --notes "Native apps v2 true window, not browser"
          }
          Write-Host "=== Uploading ==="
          $exes = Get-ChildItem -Recurse -Filter *.exe | Select-Object -First 10
          foreach ($exe in $exes) {
            Write-Host "Uploading $($exe.FullName)"
            gh release upload v1.0.0-p2p $exe.FullName --clobber 2>&1 | Write-Host
          }
          Write-Host "=== Done ==="
          gh release view v1.0.0-p2p --json assets --jq '.assets[].name' 2>&1 | Write-Host
